<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integración E-Commerce · Business Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:       #0A2463;
    --navy-mid:   #0D2F7A;
    --blue:       #1757C2;
    --blue-light: #3A86FF;
    --blue-pale:  #EBF1FF;
    --blue-mist:  #F0F4FF;
    --accent:     #00B4D8;
    --white:      #FFFFFF;
    --text-main:  #0A1A3D;
    --text-muted: #5A6E9A;
    --border:     #D2DFFF;
    --card-bg:    #FFFFFF;
    --font-display: 'Barlow Condensed', 'Aptos Narrow', Arial Narrow, sans-serif;
    --font-body:    'Barlow', 'Aptos', Arial, sans-serif;
    /* acentos por canal e-commerce, para el mapa de grupo */
    --ch-ml:        #E8A93C;
    --ch-amazon:    #2E8FE0;
    --ch-walmart:   #1757C2;
    --ch-liverpool: #D6558F;
    --ch-coppel:    #2FADE0;
    --ch-tiktok:    #101828;
  }

  html { scroll-behavior: smooth; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  body {
    font-family: var(--font-body);
    background: var(--blue-mist);
    color: var(--text-main);
    min-height: 100vh;
  }

  /* ============================================================
     APP SHELL — sidebar fija + panel principal, sin scroll de página
     ============================================================ */
  html, body { height: 100%; overflow: hidden; }

  .shell { display: flex; height: 100vh; width: 100%; }

  /* ── SIDEBAR ── */
  .sidebar {
    flex: 0 0 248px;
    height: 100vh;
    background: linear-gradient(180deg, var(--navy) 0%, #0D3280 55%, #1042A0 100%);
    color: #EAF2FB;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 24px rgba(10,36,99,0.25);
    z-index: 20;
  }

  .sidebar-brand {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    flex: 0 0 auto;
  }
  .bi-icon {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .bi-icon svg { width: 18px; height: 18px; }
  .logo-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .logo-title {
    font-family: var(--font-display); font-size: 16.5px; font-weight: 700; color: #fff;
    letter-spacing: 0.03em; line-height: 1.1; text-transform: uppercase;
  }
  .logo-sub {
    font-family: var(--font-display); font-size: 10px; font-weight: 400; color: rgba(255,255,255,0.55);
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  .badge-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .sidebar-nav { flex: 1 1 auto; padding: 14px 12px; overflow-y: auto; }
  .nav-label {
    font-family: var(--font-display); font-size: 10px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.35);
    padding: 4px 10px 9px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 10px 12px; border-radius: 9px; margin-bottom: 2px;
    background: transparent; border: none; color: #B9CEE4;
    font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    text-align: left; cursor: pointer; transition: background .18s, color .18s;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-item.active {
    background: rgba(58,134,255,0.22); color: #fff;
    box-shadow: inset 0 0 0 1px rgba(58,134,255,0.35);
  }

  .sidebar-kpis {
    flex: 0 0 auto; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.08);
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
  }
  .kpi-cell { display: flex; flex-direction: column; gap: 1px; }
  .kpi-num { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: #fff; line-height: 1; }
  .kpi-num.accent { color: var(--accent); }
  .kpi-label {
    font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45);
  }

  .sidebar-foot {
    flex: 0 0 auto; padding: 13px 18px 16px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; gap: 10px;
  }
  .header-badge {
    display: flex; align-items: center; gap: 8px; width: fit-content;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px; padding: 5px 12px;
  }
  .badge-text {
    font-family: var(--font-display); font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.85); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .sidebar-foot-text {
    font-family: var(--font-display); font-size: 10px; color: rgba(255,255,255,0.35);
    letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.5;
  }

  /* ── MAIN PANEL ── */
  .main-panel { flex: 1 1 auto; min-width: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .main-topbar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 16px 26px 13px; background: #fff; border-bottom: 1px solid var(--border);
  }
  .view-heading h1 {
    font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--navy);
    text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.1;
  }
  .view-heading p { font-size: 12px; color: var(--text-muted); margin-top: 2px; max-width: 480px; }

  .search-wrap { flex: 0 1 320px; min-width: 200px; position: relative; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
  .search-input {
    width: 100%; height: 40px; padding: 0 16px 0 42px;
    font-family: var(--font-body); font-size: 13.5px; color: var(--text-main);
    background: var(--blue-mist); border: 1px solid var(--border); border-radius: 10px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background .2s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { background: #fff; border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(58,134,255,0.12); }


  .main-scroll { flex: 1 1 auto; overflow-y: auto; padding: 14px 26px 22px; background: var(--blue-mist); }

  .search-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
  .search-input {
    width: 100%; height: 42px; padding: 0 16px 0 42px;
    font-family: var(--font-body); font-size: 14px; color: var(--text-main);
    background: #fff; border: 1px solid var(--border); border-radius: 10px; outline: none;
    box-shadow: 0 1px 4px rgba(10,36,99,0.06); transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(58,134,255,0.12); }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── PLATFORM / COMPANY CARDS ── */
  .platform-grid, .company-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: .8rem;
  }

  .platform-card, .company-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: 0 2px 12px rgba(10,36,99,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: cardIn .35s cubic-bezier(.22,.61,.36,1) both;
  }
  .platform-card:hover, .company-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(10,36,99,0.11); }

  .platform-head {
    padding: 11px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border);
  }
  .logo-wrap {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  }
  .logo-wrap img { width: 32px; height: 32px; object-fit: contain; }
  .platform-info { flex: 1; }
  .platform-name {
    font-family: var(--font-display); font-size: 16.5px; font-weight: 700; color: var(--navy);
    letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.1;
  }
  .platform-count { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }

  .company-list, .ec-rows { padding: 4px 0; }

  .company-row, .ec-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 7px 16px; border-bottom: 1px solid rgba(210,223,255,0.45); transition: background 0.15s;
  }
  .company-row:last-child, .ec-row:last-child { border-bottom: none; }
  .company-row:hover, .ec-row:hover { background: var(--blue-pale); }

  .company-name {
    font-size: 13px; font-weight: 500; color: var(--text-main); flex: 1; min-width: 0;
  }
  .store-pill {
    display: inline-flex; align-items: center; gap: 5px; background: var(--blue-pale);
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 11px;
    font-size: 11px; font-weight: 500; color: var(--blue); white-space: nowrap; flex-shrink: 0;
  }
  .store-pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--blue-light); flex-shrink: 0; }

  .company-head {
    padding: 11px 16px; background: linear-gradient(135deg, #F5F8FF 0%, #EBF1FF 100%);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
  }
  .company-avatar {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--navy) 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 14.5px; font-weight: 700; color: #fff;
    flex-shrink: 0; letter-spacing: 0.02em;
  }
  .company-head-info { flex: 1; }
  .company-head-name {
    font-family: var(--font-display); font-size: 14.5px; font-weight: 700; color: var(--navy);
    line-height: 1.2; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .company-platforms-count { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .ec-logo-sm {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  }
  .ec-logo-sm img { width: 20px; height: 20px; object-fit: contain; }
  .ec-name {
    font-family: var(--font-display); font-size: 12.5px; font-weight: 700; color: var(--navy);
    letter-spacing: 0.03em; text-transform: uppercase; min-width: 96px;
  }
  .ec-store {
    font-size: 11.5px; color: var(--text-muted); margin-left: auto; background: var(--blue-pale);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; white-space: nowrap;
  }

  /* ── EMPTY ── */
  .empty-state { text-align: center; padding: 2.6rem 2rem; color: var(--text-muted); grid-column: 1 / -1; }
  .empty-state svg { width: 38px; height: 38px; margin-bottom: 10px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ============================================================
     VISTA · POR GRUPO — Matriz de integración
     Tabla razón social / tienda × canal e-commerce, agrupada por
     grupo. Todo el ecosistema visible de un vistazo, sin clics.
     ============================================================ */
  .matrix-frame {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 2px 12px rgba(10,36,99,.06); overflow: hidden;
  }

  .integration-matrix { width: 100%; border-collapse: collapse; font-size: 13px; }

  .integration-matrix thead th {
    position: sticky; top: 0; z-index: 2;
    background: #F5F8FF; border-bottom: 1px solid var(--border);
    padding: 10px 14px; text-align: left;
    font-family: var(--font-display); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
    white-space: nowrap;
  }
  .integration-matrix .th-channel { text-align: center; }
  .th-ch-inner { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .th-ch-inner img, .th-ch-inner span.fallback { width: 16px; height: 16px; object-fit: contain; }

  .integration-matrix tbody td {
    padding: 8px 14px; border-bottom: 1px solid rgba(210,223,255,0.5);
    color: var(--text-main); vertical-align: middle;
  }

  .group-row td {
    background: var(--blue-mist); padding: 9px 14px;
    border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);
  }
  .group-row:first-child td { border-top: none; }
  .group-dot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 9px; vertical-align: middle; }
  .group-name {
    font-family: var(--font-display); font-weight: 700; font-size: 13.5px;
    letter-spacing: 0.03em; text-transform: uppercase; color: var(--navy); vertical-align: middle;
  }
  .group-meta { font-size: 11.5px; color: var(--text-muted); margin-left: 12px; vertical-align: middle; }

  .tienda-row { animation: cardIn .3s cubic-bezier(.22,.61,.36,1) both; transition: opacity .2s, background .15s; }
  .tienda-row:hover { background: var(--blue-pale); }

  .razon-cell { font-weight: 600; color: var(--navy); border-right: 1px solid rgba(210,223,255,0.5); }
  .tienda-cell { color: var(--blue); font-size: 12.5px; }

  .cell-yes, .cell-no { text-align: center; width: 46px; }
  .cell-dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(23,87,194,.08);
  }
  .cell-no { color: var(--border); font-weight: 300; }

  .integration-matrix.dimmed .tienda-row { opacity: .25; }
  .integration-matrix.dimmed .tienda-row.match { opacity: 1; background: #FFF7E0; }


  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; }
    .shell { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar { flex-direction: row; align-items: center; width: 100%; height: auto; box-shadow: 0 2px 20px rgba(10,36,99,.25); }
    .sidebar-brand { border-bottom: none; border-right: 1px solid rgba(255,255,255,.08); flex: 0 0 auto; }
    .sidebar-nav { flex: 1 1 auto; display: flex; align-items: center; padding: 8px 10px; overflow-x: auto; }
    .nav-label { display: none; }
    .nav-item { flex-direction: row; white-space: nowrap; margin-bottom: 0; margin-right: 4px; }
    .sidebar-kpis, .sidebar-foot { display: none; }
    .main-panel { height: auto; overflow: visible; }
    .main-scroll { overflow-y: visible; }
  }

  @media (max-width: 600px) {
    .platform-grid, .company-grid { grid-template-columns: 1fr; }
    .main-topbar { flex-direction: column; align-items: stretch; }
    .search-wrap { flex: 1 1 auto; }
    .map-summary { gap: 16px; }
  }
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="bi-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="12" width="4" height="9" rx="1" fill="rgba(255,255,255,0.9)"/>
          <rect x="10" y="7" width="4" height="14" rx="1" fill="rgba(255,255,255,0.9)"/>
          <rect x="17" y="3" width="4" height="18" rx="1" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="logo-title">Business Intelligence</div>
        <div class="logo-sub">Integración E-Commerce</div>
      </div>
    </div>

    <nav class="sidebar-nav" role="tablist">
      <div class="nav-label">Vistas</div>
      <button class="nav-item active" id="btn-platform" role="tab" aria-selected="true" onclick="switchView('platform')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Por e-commerce</span>
      </button>
      <button class="nav-item" id="btn-company" role="tab" aria-selected="false" onclick="switchView('company')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Por compañía</span>
      </button>
      <button class="nav-item" id="btn-grupo" role="tab" aria-selected="false" onclick="switchView('grupo')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="5" cy="12" r="2.4"/><circle cx="19" cy="5" r="2.4"/><circle cx="19" cy="19" r="2.4"/>
          <path d="M7.1 11l9.8-5.2M7.1 13l9.8 5.2"/>
        </svg>
        <span>Por grupo</span>
      </button>
    </nav>

    <div class="sidebar-kpis">
      <div class="kpi-cell"><span class="kpi-num" id="stat-ec">–</span><span class="kpi-label">Plataformas</span></div>
      <div class="kpi-cell"><span class="kpi-num" id="stat-companies">–</span><span class="kpi-label">Razones sociales</span></div>
      <div class="kpi-cell"><span class="kpi-num" id="stat-stores">–</span><span class="kpi-label">Tiendas online</span></div>
      <div class="kpi-cell"><span class="kpi-num accent" id="stat-grupos">–</span><span class="kpi-label">Grupos</span></div>
    </div>

    <div class="sidebar-foot">
      <div class="header-badge">
        <div class="badge-dot"></div>
        <div class="badge-text">Datos actualizados</div>
      </div>
      <div class="sidebar-foot-text">© 2026 · Fuente: Business Intelligence · Act. 23-nov-2026</div>
    </div>
  </aside>

  <!-- MAIN PANEL -->
  <div class="main-panel">

    <div class="main-topbar">
      <div class="view-heading">
        <h1 id="view-title">Por e-commerce</h1>
        <p id="view-desc">Empresas registradas en cada plataforma de comercio electrónico.</p>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="text" id="search" placeholder="Buscar empresa, tienda, plataforma o grupo…" oninput="handleSearch(this.value)" aria-label="Buscar">
      </div>
    </div>

    <div class="main-scroll">
      <!-- VIEW: PLATFORM -->
      <div class="view active" id="view-platform" role="tabpanel">
        <div class="platform-grid" id="platform-grid"></div>
      </div>

      <!-- VIEW: COMPANY -->
      <div class="view" id="view-company" role="tabpanel">
        <div class="company-grid" id="company-grid"></div>
      </div>

      <!-- VIEW: GRUPO — Matriz de Integración -->
      <div class="view" id="view-grupo" role="tabpanel">
        <div class="matrix-frame">
          <table class="integration-matrix" id="integration-matrix">
            <thead id="matrix-head"></thead>
            <tbody id="matrix-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   DATOS MAESTROS
   Fuente única de verdad. Nada está hardcodeado en el HTML:
   toda la interfaz (KPIs, tarjetas y mapa) se genera desde aquí.
   ============================================================ */

const LOGOS = {
  "Mercado Libre": "https://http2.mlstatic.com/storage/pog-cm-admin/calm-assets/mercado-libre-thumbnail--1538x1510--991f0a66.webp",

/* ============================================================

   ============================================================ */

function slugify(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function buildCompanyMap() {
  const map = {};
  PLATFORMS.forEach(p => {
    p.companies.forEach(c => {
      if (!map[c.razon]) map[c.razon] = [];
      map[c.razon].push({ ec: p.name, tienda: c.tienda });
    });
  });
  return map;
}

function logoImg(platform, size) {
  const s = size || 36;
  const fb = LOGO_FALLBACK[platform] || platform.slice(0,3).toUpperCase();
  return `<img src="${LOGOS[platform]}" alt="${platform} logo" width="${s}" height="${s}"
    style="width:${s}px;height:${s}px;object-fit:contain;"
    onerror="this.outerHTML='<span style=\\'font-family:var(--font-display);font-size:10px;font-weight:700;color:var(--blue);\\'>'+\\'${fb}\\'+\\'</span>'"
  >`;
}

/* ============================================================

   ============================================================ */

function buildGroupModel() {
  const grupos = {};      // nombre → { razones:Set, tiendas:Set(key), canales:Set, integraciones:number }
  const razonIndex = {};  // razon  → { grupo, tiendas:Set(key), canales:Set }
  const tiendaIndex = {}; // key    → { razon, tienda, grupo, canales:Set }

  PLATFORMS.forEach(p => {
    p.companies.forEach(c => {
      const grupo = COMPANY_GROUP[c.razon] || "Sin grupo";
      const key = c.razon + '::' + c.tienda;

      if (!grupos[grupo]) grupos[grupo] = { razones: new Set(), tiendas: new Set(), canales: new Set(), integraciones: 0 };
      grupos[grupo].razones.add(c.razon);
      grupos[grupo].tiendas.add(key);
      grupos[grupo].canales.add(p.name);
      grupos[grupo].integraciones++;

      if (!razonIndex[c.razon]) razonIndex[c.razon] = { grupo, tiendas: new Set(), canales: new Set() };
      razonIndex[c.razon].tiendas.add(key);
      razonIndex[c.razon].canales.add(p.name);

      if (!tiendaIndex[key]) tiendaIndex[key] = { razon: c.razon, tienda: c.tienda, grupo, canales: new Set() };
      tiendaIndex[key].canales.add(p.name);
    });
  });

  return { grupos, razonIndex, tiendaIndex };
}

/* ============================================================
   VISTA · POR GRUPO — Matriz de integración
   Tabla razón social / tienda × canal, agrupada por grupo.
   Toda la relación completa visible de un vistazo, sin clics
   ni pasos intermedios — pensada para lectura inmediata.
   ============================================================ */

let searchQuery = '';

function escAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

/* filas (tiendas) de un grupo, ordenadas y con el span de cada razón social para el rowspan */
function buildGroupRows(grupoName) {
  const { razonIndex, tiendaIndex } = GROUP_MODEL;
  const g = GROUP_MODEL.grupos[grupoName];
  if (!g) return [];

  const razones = [...g.razones].sort();
  const rows = [];
  razones.forEach(razon => {
    const tiendaKeys = [...razonIndex[razon].tiendas].filter(k => tiendaIndex[k].grupo === grupoName).sort();
    tiendaKeys.forEach((tKey, i) => {
      const t = tiendaIndex[tKey];
      rows.push({ razon, tienda: t.tienda, tiendaKey: tKey, canales: t.canales, isFirst: i === 0, span: tiendaKeys.length });
    });
  });
  return rows;
}

function renderMatrix() {
  const channels = PLATFORMS.map(p => p.name);
  const groups = Object.keys(GROUP_MODEL.grupos).sort();

  const headHtml = `<tr>
    <th class="th-razon">Razón Social</th>
    <th class="th-tienda">Tienda Online</th>
    ${channels.map(ch => `<th class="th-channel"><div class="th-ch-inner">${logoImg(ch, 16)}<span>${ch}</span></div></th>`).join('')}
  </tr>`;

  let bodyHtml = '';
  groups.forEach(g => {
    const gm = GROUP_MODEL.grupos[g];
    const color = GROUP_COLOR[g] || 'var(--blue)';
    bodyHtml += `<tr class="group-row">
      <td colspan="${2 + channels.length}">
        <span class="group-dot" style="background:${color}"></span>
        <span class="group-name">${g}</span>
        <span class="group-meta">${gm.razones.size} razones sociales · ${gm.tiendas.size} tiendas · ${gm.canales.size} canales</span>
      </td>
    </tr>`;

    buildGroupRows(g).forEach(r => {
      const searchText = (r.razon + ' ' + r.tienda + ' ' + [...r.canales].join(' ')).toLowerCase();
      bodyHtml += `<tr class="tienda-row" data-search="${escAttr(searchText)}">`;
      if (r.isFirst) bodyHtml += `<td class="razon-cell" rowspan="${r.span}">${r.razon}</td>`;
      bodyHtml += `<td class="tienda-cell">${r.tienda}</td>`;
      channels.forEach(ch => {
        if (r.canales.has(ch)) {
          const accent = CHANNEL_ACCENT[ch] || 'var(--blue)';
          bodyHtml += `<td class="cell-yes"><span class="cell-dot" style="background:${accent}"></span></td>`;
        } else {
          bodyHtml += `<td class="cell-no">–</td>`;
        }
      });
      bodyHtml += `</tr>`;
    });
  });

  document.getElementById('matrix-head').innerHTML = headHtml;
  document.getElementById('matrix-body').innerHTML = bodyHtml;

  if (searchQuery) filterMatrixHighlight(searchQuery);
}

function filterMatrixHighlight(query) {
  searchQuery = (query || '').trim();
  const table = document.getElementById('integration-matrix');
  if (!table) return;
  const rows = [...table.querySelectorAll('.tienda-row')];

  if (!searchQuery) {
    table.classList.remove('dimmed');
    rows.forEach(r => r.classList.remove('match'));
    return;
  }

  const q = searchQuery.toLowerCase();
  let any = false;
  rows.forEach(r => {
    const match = (r.dataset.search || '').includes(q);
    r.classList.toggle('match', match);
    if (match) any = true;
  });
  table.classList.toggle('dimmed', any);
}

function switchView(view) {
  currentView = view;
  document.getElementById('view-platform').classList.toggle('active', view === 'platform');
  document.getElementById('view-company').classList.toggle('active', view === 'company');
  document.getElementById('view-grupo').classList.toggle('active', view === 'grupo');
  document.getElementById('btn-platform').classList.toggle('active', view === 'platform');
  document.getElementById('btn-platform').setAttribute('aria-selected', view === 'platform');
  document.getElementById('btn-company').classList.toggle('active', view === 'company');
  document.getElementById('btn-company').setAttribute('aria-selected', view === 'company');
  document.getElementById('btn-grupo').classList.toggle('active', view === 'grupo');
  document.getElementById('btn-grupo').setAttribute('aria-selected', view === 'grupo');

  document.getElementById('view-title').textContent = VIEW_META[view].title;
  document.getElementById('view-desc').textContent = VIEW_META[view].desc;

  const q = document.getElementById('search').value;
  if (view === 'platform') renderPlatform(q);
  else if (view === 'company') renderCompany(q);
  else {
    searchQuery = q;
    renderMatrix();
  }
}

function handleSearch(val) {
  if (currentView === 'platform') renderPlatform(val);
  else if (currentView === 'company') renderCompany(val);
  else filterMatrixHighlight(val);
}

function renderHeaderStats() {
  const razones = new Set();

  PLATFORMS.forEach(p => p.companies.forEach(c => { razones.add(c.razon); tiendas.add(c.razon + '::' + c.tienda); }));

  document.getElementById('stat-stores').textContent = tiendas.size;

}
